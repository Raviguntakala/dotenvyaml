[project]
name = "dotenvyaml"
version = "0.2.0"
description = "Load environment variables from .env.yaml files. Like python-dotenv, but for YAML. Powered by Rust."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ravi Kumar", email = "raviguntakala1998@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
keywords = ["environment", "variables", "yaml", "dotenv", "config", "configuration", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/Raviguntakala/dotenvyaml"
Repository = "https://github.com/Raviguntakala/dotenvyaml"
Issues = "https://github.com/Raviguntakala/dotenvyaml/issues"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "dotenvyaml._rust"
manifest-path = "crates/pyo3/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["python/dotenvyaml"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
